<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tab</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="scroll.css" />
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="menu.css" />
    <link rel="stylesheet" href="tab.css" />
  </head>
  <body>
    <div id="state">starting</div>
    <div id="signin-at"></div>
    <div id="split">
      <section id="files-pane">
        <header id="files-head">
          <svg class="pane-glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 3.5h3.6l1.2 1.4h6.2v6.6a1 1 0 0 1-1 1H2.5a1 1 0 0 1-1-1z" /></svg>
          <span>Files</span>
        </header>
        <div id="files"></div>
      </section>
      <div id="grip" tabindex="0" role="separator" aria-orientation="vertical" aria-label="How much of the tab the files take"></div>
      <section id="term-pane">
        <header id="term-head">
          <svg class="pane-glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 4l3 3-3 3M7.6 10.4h3.8" /></svg>
          <span>Terminal</span>
          <!-- How large its letters are, shown only while that is not its own size: a readout that always
               says 100% is a readout nobody reads (BUILD-RULES 2.8). -->
          <span id="term-zoom" hidden></span>
          <!-- Which renderer is drawing, shown only while it is not the one that can colour a prompt: a
               readout that always says the same thing is a readout nobody reads (BUILD-RULES 2.8). A state
               belongs in the head, never in the output, where only what the box said is drawn. -->
          <span id="term-drawn" hidden></span>
          <!-- Finding words in what the box has printed. A glyph, not a field standing open all day: the
               same answer the file list beside it got (his, 2026-11-18 night). Ctrl+Shift+F opens it too,
               and that press is main's, never this page's, so no box can see it or ask for it. -->
          <button id="term-find-open" type="button" class="head-find-open" aria-expanded="false"></button>
          <div id="term-find" class="head-find" hidden>
            <input id="term-find-field" class="head-find-field" type="text" spellcheck="false" autocomplete="off" />
            <span id="term-find-count" class="head-find-count"></span>
            <button id="term-find-back" type="button" class="head-find-step"></button>
            <button id="term-find-next" type="button" class="head-find-step"></button>
          </div>
        </header>
        <div id="term"></div>
      </section>
    </div>
    <!-- Over the terminal, and after it: the terminal draws its rows in placed elements of its own. -->
    <div id="chrome"></div>
    <script src="tab.js"></script>
  </body>
</html>
