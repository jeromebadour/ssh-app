name: CI

# Every pull request, and main after each merge. These jobs must pass before merge.yml merges a pull request:
#   checks: everything that needs no window (types, the no-blocking-calls rule, Go vet and tests, a short fuzz run).
#   lab:    the real app on a virtual screen with Chromium's sandbox on: its self-test in the built tree and in
#           the lab package, then the release package with no debugger and no test hook.
#   vuln:   known vulnerabilities in the Go code that ships.
# Changes reach main only through a pull request; merge.yml does the merging once the whole run passed.
# On main a third job, from-a-pull-request, fails the run if a commit got there any other way.
# A pull request that changes toolchain/windows-run also gets the Windows run (jobs plan and windows), and one
# that changes the engine also gets the real OpenSSH servers (job openssh).
# Actions are GitHub's own, pinned by commit. Nothing here has write access.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned packages (no install scripts)
        run: npm ci --ignore-scripts
      - name: The pinned Go toolchain
        run: bash scripts/get-go.sh
      - name: The vendored Go modules are exactly what a fresh, checked fetch gives
        run: bash scripts/vendor.sh check
      - name: Checks
        run: bash scripts/check.sh

  # Known vulnerabilities in the Go code that ships, for Linux and for Windows. The checker is a test tool: it is
  # fetched in this job and nowhere else (pinned in toolchain/govulncheck-version, checked against Go's checksum
  # log), and nothing built here ships.
  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned Go toolchain
        run: bash scripts/get-go.sh
      - name: govulncheck
        run: |
          source scripts/env.sh
          version="$(cat toolchain/govulncheck-version)"
          GOBIN="$RUNNER_TEMP/bin" GOFLAGS= GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go install "golang.org/x/vuln/cmd/govulncheck@$version"
          cd engine
          echo "for Linux:";   "$RUNNER_TEMP/bin/govulncheck" ./...
          echo "for Windows:"; GOOS=windows "$RUNNER_TEMP/bin/govulncheck" ./...

  # Decides whether this pull request asks for the Windows run: it does by changing toolchain/windows-run.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      windows: ${{ steps.files.outputs.windows }}
      openssh: ${{ steps.files.outputs.openssh }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          windows=false
          openssh=false
          files=""
          if [ -n "$NUMBER" ]; then files="$(gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename')"; fi
          if grep -qx 'toolchain/windows-run' <<<"$files"; then windows=true; fi
          # The engine runs on his PC, so a change to it is a change to what Windows runs: it asks for the
          # Windows run of its own accord. Before this, a release was the first thing to run those tests on
          # Windows, and it found every file test of the engine failing there.
          if grep -qE '^(engine/|\.github/workflows/ci\.yml$)' <<<"$files"; then windows=true; fi
          # The workflow itself counts: the step that runs these tests, and the names it runs, live here, and a
          # change to them that cannot be run is a change nobody has proved.
          if grep -qE '^(engine/|scripts/lab-openssh\.sh$|toolchain/lab-images$|toolchain/go\.env$|\.github/workflows/ci\.yml$)' <<<"$files"; then openssh=true; fi
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "openssh=$openssh" >> "$GITHUB_OUTPUT"
          echo "the Windows run: $windows; the real OpenSSH servers: $openssh"

  # The engine's link against real OpenSSH servers: the newest, and 8.9, the oldest the app supports. They run
  # in containers pinned by digest (toolchain/lab-images). Only when a pull request changes the engine or the
  # lab itself: nothing else can change what this proves.
  openssh:
    needs: plan
    if: needs.plan.outputs.openssh == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned Go toolchain
        run: bash scripts/get-go.sh
      - name: Real OpenSSH servers, in containers
        run: bash scripts/lab-openssh.sh up
      - name: The link against them
        run: |
          source scripts/env.sh
          cd engine
          # Every test that needs the real servers, named one by one. A pattern anchored to a single name is
          # how a test written later runs nowhere and is reported as proof all the same: TestOpenSSHFirstVisit
          # was added, this job went green, and it had not run.
          # The test's own exit status is what decides, not the grep's: piping go test into grep hands the step
          # grep's status instead, and a failing test then prints its failure and the job goes green on it.
          # That is how every file-protocol test against a real box failed unseen from the day this job existed.
          LAB_OPENSSH="$GITHUB_WORKSPACE/out/lab-openssh" LAB_OPENSSH_REQUIRED=1 go test -count=1 -v -run '^(TestOpenSSH|TestOpenSSHFirstVisit)$' ./internal/link > /tmp/openssh.out 2>&1 || true
          grep -E '^(\s*--- |ok|FAIL|panic|\s+\S+_test\.go)' /tmp/openssh.out || true
          grep -qE '^ok\s' /tmp/openssh.out || { echo "openssh: the tests against the real servers did not pass" >&2; exit 1; }
          # And every one of them really ran: a skip here means the lab was not there, and a run that proves
          # nothing must not pass for one that does.
          for t in TestOpenSSH TestOpenSSHFirstVisit; do
            grep -qE "^--- PASS: $t\b" /tmp/openssh.out || { echo "openssh: $t did not run against the real servers" >&2; exit 1; }
          done

  # The Windows run. Not on every pull request (Windows runner time costs more): only when asked, see `plan`.
  # It builds everything again on Windows from the same commit, so it is also a second builder: the Windows
  # packages it makes must be, file for file, the ones the Linux job made.
  windows:
    needs: [plan, lab]
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2025
    # The box screens hold 459 probes and the runner now lets that package run to the end rather than cutting
    # it off at 150 seconds, which is all it ever got: it only seemed to fit because a probe threw partway
    # through. A gate that stops a release has to have read the whole thing.
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned packages (no install scripts)
        run: npm ci --ignore-scripts
      - name: The pinned Go toolchain
        run: bash scripts/get-go.sh
      - name: The engine's tests on Windows (the process tests, and the patience read back from Windows)
        # The test's own verdict decides this step, not grep's. Piping it through grep hands the step grep's
        # exit status, so a failing test prints its failure and the job goes green on it: every file test of
        # the engine was failing on Windows that way, unseen, until a release run (which does not pipe) said
        # so. The output goes to a file, grep makes it readable, and the file is what is judged.
        run: |
          source scripts/env.sh
          cd engine
          go vet ./...
          set +e
          go test -count=1 -v -run 'Test' ./... > /tmp/windows-tests.out 2>&1
          code=$?
          set -e
          grep -E '^(=== RUN|--- |ok|FAIL|panic|\s+\S+_test.go)' /tmp/windows-tests.out || true
          grep -qE '^FAIL' /tmp/windows-tests.out && { echo "::error::A test failed on Windows."; exit 1; }
          [ "$code" -eq 0 ] || { echo "::error::The engine's tests on Windows ended $code."; exit 1; }
          grep -qE '^ok\s' /tmp/windows-tests.out || { echo "::error::No test ran on Windows."; exit 1; }
      - name: Build
        run: bash scripts/build.sh
      - name: The Windows packages, built here
        run: node scripts/package.mjs win32
      - name: A second builder agrees with the first
        env:
          LINUX_BUILT: ${{ needs.lab.outputs.win32 }}
        run: |
          here="$(node -e 'const r=require("./out/report.json");console.log(JSON.stringify({archive:r.archive.sha256,lab:r.packages["Berth-win32-x64-lab"].manifestSha256,release:r.packages["Berth-win32-x64-release"].manifestSha256}))')"
          echo "built on Linux:   $LINUX_BUILT"
          echo "built on Windows: $here"
          [ -n "$LINUX_BUILT" ] && [ "$here" = "$LINUX_BUILT" ] || { echo "::error::The two builders made different Windows packages."; exit 1; }
      - name: The Windows packages, run
        run: node scripts/smoke-windows.mjs

      - name: The release zip, and the install proof
        # The zip is made from packages built under the same version it is named with, because the release
        # refuses a program whose own properties say it is something else: the version a person reads in the
        # file's properties and the version of the thing they downloaded are the same thing or they are a
        # lie. The real release passes its version the same way (release.yml).
        run: |
          BERTH_VERSION=0.0.0-ci node scripts/package.mjs win32
          BERTH_VERSION=0.0.0-ci node scripts/release.mjs 0.0.0-ci
          node scripts/smoke-install.mjs

  # GitHub offers no ruleset for a private repo on the free plan, so nothing there blocks a direct push to main.
  # This job makes one loud: on main, the commit must be the merge of a pull request, or the run fails.
  from-a-pull-request:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: This commit on main must be the merge of a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash scripts/from-pr.sh

  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      win32: ${{ steps.report.outputs.win32 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned packages (no install scripts)
        run: npm ci --ignore-scripts
      - name: Electron's binary, checked against the checksums inside its package
        run: node node_modules/electron/install.js
      - name: The pinned Go toolchain
        run: bash scripts/get-go.sh
      - name: Build
        run: bash scripts/build.sh
      - name: A virtual screen
        run: command -v xvfb-run >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
      - name: The self-test, in the built tree
        run: bash scripts/smoke.sh dev
      - name: The four packages (lab and release, Linux and Windows), fuses and integrity read back
        run: node scripts/package.mjs
      - name: What was built, for the second builder to compare
        id: report
        run: |
          echo "win32=$(node -e 'const r=require("./out/report.json");console.log(JSON.stringify({archive:r.archive.sha256,lab:r.packages["Berth-win32-x64-lab"].manifestSha256,release:r.packages["Berth-win32-x64-release"].manifestSha256}))')" >> "$GITHUB_OUTPUT"
      - name: The lab package (the self-test packaged, seven tabs, children end with their parent, a swapped engine)
        run: bash scripts/smoke.sh lab
      - name: A picture of the whole window, from the real app
        run: bash scripts/pictures.sh 1280x720 1.25
      - name: The release package (no debugger, no test hook, exits on any argument)
        run: bash scripts/smoke.sh release
