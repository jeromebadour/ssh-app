name: CI

# Every pull request, and main after each merge. Two jobs must pass before merge.yml merges a pull request:
#   checks: everything that needs no window (types, the no-blocking-calls rule, Go vet and tests, a short fuzz run).
#   lab:    the real app on a virtual screen with Chromium's sandbox on: its self-test in the built tree and in
#           the lab package, then the release package with no debugger and no test hook.
# Changes reach main only through a pull request; merge.yml does the merging once both jobs pass.
# On main a third job, from-a-pull-request, fails the run if a commit got there any other way.
# Actions are GitHub's own, pinned by commit. Nothing here has write access.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned packages (no install scripts)
        run: npm ci --ignore-scripts
      - name: The pinned Go toolchain
        run: bash scripts/get-go.sh
      - name: Checks
        run: bash scripts/check.sh

  # GitHub offers no ruleset for a private repo on the free plan, so nothing there blocks a direct push to main.
  # This job makes one loud: on main, the commit must be the merge of a pull request, or the run fails.
  from-a-pull-request:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: This commit on main must be the merge of a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash scripts/from-pr.sh

  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned packages (no install scripts)
        run: npm ci --ignore-scripts
      - name: Electron's binary, checked against the checksums inside its package
        run: node node_modules/electron/install.js
      - name: The pinned Go toolchain
        run: bash scripts/get-go.sh
      - name: Build
        run: bash scripts/build.sh
      - name: A virtual screen
        run: command -v xvfb-run >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
      - name: The self-test, in the built tree
        run: bash scripts/smoke.sh dev
      - name: The four packages (lab and release, Linux and Windows), fuses and integrity read back
        run: node scripts/package.mjs
      - name: The lab package (the same self-test in a packaged app, and a swapped engine)
        run: bash scripts/smoke.sh lab
      - name: The release package (no debugger, no test hook, exits on any argument)
        run: bash scripts/smoke.sh release
